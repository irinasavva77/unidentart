<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - UnidentArt</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1 class="login-title">Unident<span>Art</span> Admin</h1>
      <p class="login-subtitle">Introdu parola pentru a accesa panoul de administrare</p>
      
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" style="justify-content: flex-start;">Parola</label>
          <input type="password" id="password" class="form-input" placeholder="Introdu parola" required>
        </div>
        
        <div id="error-message" class="login-error hidden">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
          <span>Parola incorecta. Incearca din nou.</span>
        </div>
        
        <button type="submit" class="btn btn-secondary btn-full" id="submit-btn">Autentificare</button>
      </form>
      
      <div class="login-hint">
        <p>Parola demo: <code>unidentart2024</code></p>
      </div>
    </div>
  </div>

  <script src="../js/store.js"></script>
  <script>
    // Check if already logged in
    if (store.isAdminAuthenticated) {
      window.location.href = 'index.html';
    }

    const form = document.getElementById('login-form');
    const errorMessage = document.getElementById('error-message');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const password = document.getElementById('password').value;
      submitBtn.textContent = 'Se autentifica...';
      submitBtn.disabled = true;
      
      setTimeout(() => {
        if (store.loginAdmin(password)) {
          window.location.href = 'index.html';
        } else {
          errorMessage.classList.remove('hidden');
          submitBtn.textContent = 'Autentificare';
          submitBtn.disabled = false;
        }
      }, 500);
    });
  </script>
</body>
</html>
