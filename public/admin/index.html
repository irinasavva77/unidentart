<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - UnidentArt Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="sidebar-logo">Unident<span>Art</span></div>
      
      <nav class="sidebar-nav">
        <a href="index.html" class="sidebar-link active">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          Dashboard
        </a>
        <a href="programari.html" class="sidebar-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
          Programari
        </a>
        <a href="setari.html" class="sidebar-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          Servicii & Echipa
        </a>
      </nav>
      
      <div class="sidebar-footer">
        <a href="../index.html" class="sidebar-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Inapoi la Site
        </a>
        <button onclick="logout()" class="sidebar-link" style="width: 100%; border: none; background: none; cursor: pointer; text-align: left;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
          Deconectare
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-content">
      <h1 style="margin-bottom: 0.5rem;">Dashboard</h1>
      <p style="color: var(--muted-foreground); margin-bottom: 2rem;">Bine ai venit in panoul de administrare</p>

      <!-- Stats Grid -->
      <div class="stats-grid" id="stats-grid">
        <!-- Stats will be populated by JavaScript -->
      </div>

      <!-- Two Column Layout -->
      <div class="grid-2">
        <!-- Recent Appointments -->
        <div class="admin-card">
          <div class="admin-card-header">
            <h2>Programari Recente</h2>
          </div>
          <div class="admin-card-body" id="recent-appointments">
            <!-- Will be populated by JavaScript -->
          </div>
        </div>

        <!-- Services Overview -->
        <div class="admin-card">
          <div class="admin-card-header">
            <h2>Servicii Populare</h2>
          </div>
          <div class="admin-card-body" id="services-overview">
            <!-- Will be populated by JavaScript -->
          </div>
        </div>
      </div>

      <!-- Status Overview -->
      <div class="admin-card mt-6">
        <div class="admin-card-header">
          <h2>Statusul Programarilor</h2>
        </div>
        <div class="admin-card-body">
          <div class="stats-grid" id="status-overview">
            <!-- Will be populated by JavaScript -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/store.js"></script>
  <script src="../js/main.js"></script>
  <script>
    // Check authentication
    if (!store.isAdminAuthenticated) {
      window.location.href = 'login.html';
    }

    function logout() {
      store.logoutAdmin();
      window.location.href = 'login.html';
    }

    // Populate stats
    const stats = store.getStats();
    const statsGrid = document.getElementById('stats-grid');
    statsGrid.innerHTML = `
      <div class="stat-card">
        <div class="stat-card-inner">
          <div class="stat-icon blue">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
          </div>
          <div class="stat-info">
            <p>Total Programari</p>
            <h3>${stats.total}</h3>
          </div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-card-inner">
          <div class="stat-icon yellow">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div class="stat-info">
            <p>In Asteptare</p>
            <h3>${stats.pending}</h3>
          </div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-card-inner">
          <div class="stat-icon green">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <div class="stat-info">
            <p>Finalizate</p>
            <h3>${stats.completed}</h3>
          </div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-card-inner">
          <div class="stat-icon blue">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <div class="stat-info">
            <p>Doctori</p>
            <h3>${store.doctors.length}</h3>
          </div>
        </div>
      </div>
    `;

    // Populate recent appointments
    const recentAppointments = document.getElementById('recent-appointments');
    const sortedAppointments = [...store.appointments]
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
      .slice(0, 5);

    if (sortedAppointments.length === 0) {
      recentAppointments.innerHTML = '<p style="color: var(--muted-foreground);">Nu exista programari</p>';
    } else {
      recentAppointments.innerHTML = sortedAppointments.map(apt => {
        const doctor = store.getDoctorById(apt.doctorId);
        const service = store.getServiceById(apt.serviceId);
        return `
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 0.75rem; background: var(--muted); border-radius: var(--radius); margin-bottom: 0.5rem;">
            <div>
              <p style="font-weight: 500;">${apt.lastName} ${apt.firstName}</p>
              <p style="font-size: 0.875rem; color: var(--muted-foreground);">${doctor?.name || '-'} - ${service?.name || '-'}</p>
              <p style="font-size: 0.75rem; color: var(--muted-foreground);">${apt.date} la ${apt.time}</p>
            </div>
            <span class="status-badge status-${apt.status}">${getStatusText(apt.status)}</span>
          </div>
        `;
      }).join('');
    }

    // Populate services overview
    const servicesOverview = document.getElementById('services-overview');
    servicesOverview.innerHTML = store.services.slice(0, 5).map(service => {
      const appointmentCount = store.appointments.filter(a => a.serviceId === service.id).length;
      return `
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <div style="width: 2.5rem; height: 2.5rem; border-radius: 0.5rem; background: rgba(37,150,190,0.1); display: flex; align-items: center; justify-content: center;">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg>
            </div>
            <div>
              <p style="font-weight: 500; font-size: 0.875rem;">${service.name}</p>
              <p style="font-size: 0.75rem; color: var(--muted-foreground);">${service.duration}</p>
            </div>
          </div>
          <span style="font-size: 0.875rem; color: var(--muted-foreground);">${appointmentCount} programari</span>
        </div>
      `;
    }).join('');

    // Populate status overview
    const statusOverview = document.getElementById('status-overview');
    statusOverview.innerHTML = `
      <div style="display: flex; align-items: center; gap: 0.75rem; padding: 1rem; background: #fef3c7; border-radius: var(--radius);">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        <div>
          <p style="font-size: 1.5rem; font-weight: 700; color: #92400e;">${stats.pending}</p>
          <p style="font-size: 0.875rem; color: #d97706;">In asteptare</p>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 0.75rem; padding: 1rem; background: #dbeafe; border-radius: var(--radius);">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <div>
          <p style="font-size: 1.5rem; font-weight: 700; color: #1e40af;">${stats.confirmed}</p>
          <p style="font-size: 0.875rem; color: #2563eb;">Confirmate</p>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 0.75rem; padding: 1rem; background: #dcfce7; border-radius: var(--radius);">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <div>
          <p style="font-size: 1.5rem; font-weight: 700; color: #166534;">${stats.completed}</p>
          <p style="font-size: 0.875rem; color: #16a34a;">Finalizate</p>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 0.75rem; padding: 1rem; background: #fee2e2; border-radius: var(--radius);">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
        <div>
          <p style="font-size: 1.5rem; font-weight: 700; color: #991b1b;">${stats.cancelled}</p>
          <p style="font-size: 0.875rem; color: #dc2626;">Anulate</p>
        </div>
      </div>
    `;
  </script>
</body>
</html>
